apiVersion: batch/v1
kind: CronJob
metadata:
  name: my-app-cronjob
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: my-app
        spec:
          restartPolicy: OnFailure
          containers:
            - name: app
              image: mendhak/http-https-echo:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "CronJob 啟動，開始模擬任務..."
                  sleep 10 # 模擬任務執行中
                  echo "任務完成，準備退出。"
                  exit 0
              envFrom:
                - configMapRef:
                    name: my-app-config
                - secretRef:
                    name: my-app-secret
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
