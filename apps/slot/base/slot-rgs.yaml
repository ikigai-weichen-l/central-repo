apiVersion: apps/v1
kind: Deployment
metadata:
  name: slot-rgs
  namespace: slot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slot-rgs
  template:
    metadata:
      labels:
        app: slot-rgs
    spec:
      containers:
        - name: slot-rgs
          image: ghcr.io/ikigai-weichen-l/project-repo:f14a52dd55aa768bce204d4d04803f55256954a7
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: slot-rgs
  namespace: slot
spec:
  selector:
    app: slot-rgs
  ports:
    - port: 80
      targetPort: 8080
