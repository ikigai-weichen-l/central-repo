apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-bridge
  namespace: live
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-bridge
  template:
    metadata:
      labels:
        app: live-bridge
    spec:
      containers:
        - name: live-bridge
          image: ghcr.io/ikigai-weichen-l/project-repo:f14a52dd55aa768bce204d4d04803f55256954a7
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: live-bridge
  namespace: live
spec:
  selector:
    app: live-bridge
  ports:
    - port: 80
      targetPort: 8080
