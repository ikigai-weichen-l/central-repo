apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: super-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ikigai-weichen-l/central-repo.git
    targetRevision: main
    path: argocd/root-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
